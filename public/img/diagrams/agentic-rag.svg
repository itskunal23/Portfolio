<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Agentic RAG execution lifecycle: query decomposition, MCP tool servers, hybrid retrieval, reranking, LLM-as-a-judge evaluation, and confidence-based human-in-the-loop routing.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;rx:10}
      .accent{fill:#eff6ff;stroke:#3b82f6}
      .warn{fill:#fff7ed;stroke:#f97316}
      .ok{fill:#f0fdf4;stroke:#22c55e}
      .t{fill:#0f172a;font-size:14px;font-weight:600}
      .s{fill:#475569;font-size:11px}
      .edge{stroke:#64748b;stroke-width:1.5;fill:none}
      .lbl{fill:#475569;font-size:10px}
      .h{fill:#475569;font-size:11px;font-weight:600;letter-spacing:1px}
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="520" fill="#f8fafc"/>

  <text x="24" y="34" class="t" font-size="16">Agentic RAG execution lifecycle</text>
  <text x="24" y="54" class="s">Conceptual architecture. Query in, grounded answer out, with escalation when confidence is low.</text>

  <!-- User query -->
  <rect x="24" y="90" width="150" height="56" rx="10" class="box accent"/>
  <text x="99" y="114" text-anchor="middle" class="t">User query</text>
  <text x="99" y="132" text-anchor="middle" class="s">natural language</text>

  <!-- Planner -->
  <rect x="214" y="80" width="170" height="76" rx="10" class="box accent"/>
  <text x="299" y="106" text-anchor="middle" class="t">LangGraph planner</text>
  <text x="299" y="124" text-anchor="middle" class="s">query decomposition</text>
  <text x="299" y="140" text-anchor="middle" class="s">state machine / routing</text>

  <!-- MCP -->
  <rect x="424" y="80" width="170" height="76" rx="10" class="box"/>
  <text x="509" y="106" text-anchor="middle" class="t">MCP tool servers</text>
  <text x="509" y="124" text-anchor="middle" class="s">tool discovery</text>
  <text x="509" y="140" text-anchor="middle" class="s">typed tool execution</text>

  <!-- Retrieval block -->
  <text x="24" y="210" class="h">RETRIEVAL</text>
  <rect x="24" y="222" width="170" height="60" rx="10" class="box"/>
  <text x="109" y="248" text-anchor="middle" class="t">BM25 (sparse)</text>
  <text x="109" y="266" text-anchor="middle" class="s">lexical match</text>

  <rect x="24" y="300" width="170" height="60" rx="10" class="box"/>
  <text x="109" y="326" text-anchor="middle" class="t">Dense vectors</text>
  <text x="109" y="344" text-anchor="middle" class="s">semantic match</text>

  <rect x="234" y="261" width="160" height="60" rx="10" class="box"/>
  <text x="314" y="287" text-anchor="middle" class="t">Fuse + rerank</text>
  <text x="314" y="305" text-anchor="middle" class="s">cross-encoder</text>

  <rect x="434" y="261" width="160" height="60" rx="10" class="box"/>
  <text x="514" y="287" text-anchor="middle" class="t">Generate answer</text>
  <text x="514" y="305" text-anchor="middle" class="s">grounded + citations</text>

  <!-- Judge -->
  <rect x="640" y="222" width="150" height="60" rx="10" class="box accent"/>
  <text x="715" y="248" text-anchor="middle" class="t">LLM-as-a-judge</text>
  <text x="715" y="266" text-anchor="middle" class="s">evaluate grounding</text>

  <!-- Confidence gate -->
  <rect x="640" y="300" width="150" height="60" rx="10" class="box"/>
  <text x="715" y="326" text-anchor="middle" class="t">Confidence gate</text>
  <text x="715" y="344" text-anchor="middle" class="s">threshold routing</text>

  <!-- Outcomes -->
  <rect x="640" y="392" width="150" height="52" rx="10" class="box ok"/>
  <circle cx="662" cy="412" r="8" fill="#16a34a"/>
  <path d="M658 412 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="722" y="416" text-anchor="middle" class="t">Return answer</text>
  <text x="722" y="432" text-anchor="middle" class="s">high confidence</text>

  <rect x="434" y="392" width="160" height="52" rx="10" class="box warn"/>
  <circle cx="456" cy="412" r="8" fill="#d97706"/>
  <path d="M456 408 v4" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="456" cy="416" r="0.9" fill="#ffffff"/>
  <text x="518" y="416" text-anchor="middle" class="t">Human-in-the-loop</text>
  <text x="518" y="432" text-anchor="middle" class="s">escalate ambiguous</text>

  <!-- edges top row -->
  <path class="edge" d="M174 118 H214" marker-end="url(#arr)"/>
  <path class="edge" d="M384 118 H424" marker-end="url(#arr)"/>
  <path class="edge" d="M509 156 V180 H109 V222" marker-end="url(#arr)"/>
  <text x="300" y="174" class="lbl">sub-queries dispatched to retrieval tools</text>

  <!-- retrieval edges -->
  <path class="edge" d="M194 252 H234 V272" marker-end="url(#arr)"/>
  <path class="edge" d="M194 330 H234 V305" marker-end="url(#arr)"/>
  <path class="edge" d="M394 291 H434" marker-end="url(#arr)"/>
  <path class="edge" d="M594 291 H640 V282" marker-end="url(#arr)"/>

  <!-- judge -> gate -->
  <path class="edge" d="M715 282 V300" marker-end="url(#arr)"/>
  <!-- gate outcomes -->
  <path class="edge" d="M715 360 V392" marker-end="url(#arr)"/>
  <path class="edge" d="M640 340 H514 V392" marker-end="url(#arr)"/>
  <text x="520" y="376" class="lbl">below threshold</text>
  <text x="724" y="384" class="lbl">above threshold</text>

  <!-- loop back from human -->
  <path class="edge" d="M434 418 H300 V156" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="310" y="470" class="lbl">reviewer feedback re-enters the graph</text>
</svg>
