<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="NCR entity resolution: deterministic heuristics first, then transformer-based semantic matching, with confidence thresholds routing to auto-match, review, or no-match.">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .accent{fill:#eff6ff;stroke:#3b82f6}
      .ok{fill:#f0fdf4;stroke:#22c55e}
      .warn{fill:#fff7ed;stroke:#f97316}
      .bad{fill:#fef2f2;stroke:#ef4444}
      .t{fill:#0f172a;font-size:14px;font-weight:600}
      .s{fill:#475569;font-size:11px}
      .edge{stroke:#64748b;stroke-width:1.5;fill:none}
      .lbl{fill:#475569;font-size:10px}
    </style>
  </defs>
  <rect x="0" y="0" width="920" height="380" fill="#f8fafc"/>
  <text x="24" y="34" class="t" font-size="16">NCR entity resolution cascade</text>
  <text x="24" y="54" class="s">Conceptual architecture. Cheap deterministic pass first; semantic model only for the hard cases.</text>

  <rect x="24" y="150" width="150" height="66" rx="10" class="box"/>
  <text x="99" y="178" text-anchor="middle" class="t">NCR record</text>
  <text x="99" y="196" text-anchor="middle" class="s">free-text + fields</text>

  <rect x="206" y="140" width="170" height="86" rx="10" class="box accent"/>
  <text x="291" y="168" text-anchor="middle" class="t">Deterministic match</text>
  <text x="291" y="186" text-anchor="middle" class="s">rules / IDs / exact keys</text>
  <text x="291" y="202" text-anchor="middle" class="s">handles the easy majority</text>

  <rect x="408" y="140" width="190" height="86" rx="10" class="box accent"/>
  <text x="503" y="168" text-anchor="middle" class="t">Semantic match</text>
  <text x="503" y="186" text-anchor="middle" class="s">transformer similarity</text>
  <text x="503" y="202" text-anchor="middle" class="s">on remaining ambiguous records</text>

  <rect x="640" y="140" width="120" height="86" rx="10" class="box"/>
  <text x="700" y="178" text-anchor="middle" class="t">Confidence</text>
  <text x="700" y="196" text-anchor="middle" class="s">thresholds</text>

  <rect x="795" y="60" width="100" height="56" rx="10" class="box ok"/>
  <circle cx="815" cy="78" r="8" fill="#16a34a"/>
  <path d="M811 78 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="854" y="83" text-anchor="middle" class="t">Auto-match</text>
  <text x="845" y="101" text-anchor="middle" class="s">high confidence</text>

  <rect x="795" y="156" width="100" height="56" rx="10" class="box warn"/>
  <circle cx="815" cy="174" r="8" fill="#d97706"/>
  <path d="M815 170 v4" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="815" cy="178" r="0.9" fill="#ffffff"/>
  <text x="854" y="179" text-anchor="middle" class="t">Review</text>
  <text x="845" y="197" text-anchor="middle" class="s">mid confidence</text>

  <rect x="795" y="252" width="100" height="56" rx="10" class="box bad"/>
  <circle cx="815" cy="270" r="8" fill="#dc2626"/>
  <path d="M812 267 l6 6 m0 -6 l-6 6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <text x="854" y="275" text-anchor="middle" class="t">No match</text>
  <text x="845" y="293" text-anchor="middle" class="s">low confidence</text>

  <path class="edge" d="M174 183 H206" marker-end="url(#arr3)"/>
  <path class="edge" d="M376 183 H408" marker-end="url(#arr3)"/>
  <text x="330" y="134" class="lbl">no exact match</text>
  <path class="edge" d="M598 183 H640" marker-end="url(#arr3)"/>
  <path class="edge" d="M760 165 H778 V88 H795" marker-end="url(#arr3)"/>
  <path class="edge" d="M760 183 H795" marker-end="url(#arr3)"/>
  <path class="edge" d="M760 201 H778 V280 H795" marker-end="url(#arr3)"/>
  <text x="24" y="350" class="lbl">Result: engineering cycle time reduced 95% (80h → 4h per aircraft program).</text>
</svg>
