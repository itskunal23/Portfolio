<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Enterprise recruiting platform on Azure Government Cloud: React frontend, Node.js gateway, Spring Boot services for hiring, compliance, interviews and offers, backed by a database and integrated with Workday.">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .accent{fill:#eff6ff;stroke:#3b82f6}
      .zone{fill:#f1f5f9;stroke:#cbd5e1;stroke-dasharray:5 4}
      .t{fill:#0f172a;font-size:14px;font-weight:600}
      .s{fill:#475569;font-size:11px}
      .edge{stroke:#64748b;stroke-width:1.5;fill:none}
      .lbl{fill:#475569;font-size:10px}
      .h{fill:#475569;font-size:11px;font-weight:600;letter-spacing:1px}
    </style>
  </defs>
  <rect x="0" y="0" width="920" height="380" fill="#f8fafc"/>
  <text x="24" y="34" class="t" font-size="16">Enterprise recruiting platform</text>
  <text x="24" y="54" class="s">Conceptual architecture. Azure Government Cloud; 630+ hiring managers; 7-person team.</text>

  <rect x="20" y="78" width="880" height="282" rx="12" class="zone"/>
  <text x="40" y="100" class="h">AZURE GOVERNMENT CLOUD</text>

  <rect x="48" y="150" width="140" height="70" rx="10" class="box accent"/>
  <text x="118" y="180" text-anchor="middle" class="t">React UI</text>
  <text x="118" y="198" text-anchor="middle" class="s">hiring managers</text>

  <rect x="226" y="150" width="150" height="70" rx="10" class="box"/>
  <text x="301" y="180" text-anchor="middle" class="t">Node.js gateway</text>
  <text x="301" y="198" text-anchor="middle" class="s">auth · routing</text>

  <rect x="414" y="120" width="190" height="130" rx="10" class="box accent"/>
  <text x="509" y="146" text-anchor="middle" class="t">Spring Boot services</text>
  <text x="509" y="168" text-anchor="middle" class="s">hiring workflow</text>
  <text x="509" y="186" text-anchor="middle" class="s">compliance</text>
  <text x="509" y="204" text-anchor="middle" class="s">interviews</text>
  <text x="509" y="222" text-anchor="middle" class="s">offers</text>

  <rect x="648" y="150" width="120" height="70" rx="10" class="box"/>
  <text x="708" y="180" text-anchor="middle" class="t">Database</text>
  <text x="708" y="198" text-anchor="middle" class="s">records / audit</text>

  <rect x="648" y="268" width="120" height="64" rx="10" class="box"/>
  <text x="708" y="296" text-anchor="middle" class="t">Workday</text>
  <text x="708" y="313" text-anchor="middle" class="s">handoff</text>

  <path class="edge" d="M188 185 H226" marker-end="url(#arr5)"/>
  <path class="edge" d="M376 185 H414" marker-end="url(#arr5)"/>
  <path class="edge" d="M604 185 H648" marker-end="url(#arr5)"/>
  <path class="edge" d="M509 250 V300 H648" marker-end="url(#arr5)"/>
  <text x="40" y="348" class="lbl">Offers finalized in the platform hand off to Workday for downstream HR processing.</text>
</svg>
